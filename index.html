<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Weather Radar - Advanced Meteorological Visualization</title>

    <!-- Cesium for 3D Globe -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.110/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.110/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

    <!-- Leaflet for 2D Map backup -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Chart.js for soundings -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e27;
            color: #fff;
            overflow: hidden;
        }

        #cesiumContainer {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        .control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 14, 39, 0.95);
            border: 2px solid #00ffff;
            border-radius: 10px;
            padding: 20px;
            max-width: 350px;
            max-height: 80vh;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        .control-panel h2 {
            color: #00ffff;
            margin-bottom: 15px;
            font-size: 1.3em;
            border-bottom: 2px solid #00ffff;
            padding-bottom: 10px;
        }

        .control-panel h3 {
            color: #00ccff;
            margin-top: 15px;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            color: #aaddff;
            font-size: 0.9em;
        }

        .control-group input[type="range"] {
            width: 100%;
            margin: 5px 0;
        }

        .control-group select,
        .control-group input[type="text"] {
            width: 100%;
            padding: 8px;
            background: rgba(0, 50, 100, 0.5);
            border: 1px solid #00aaff;
            border-radius: 5px;
            color: #fff;
            font-size: 0.9em;
        }

        .btn {
            background: linear-gradient(135deg, #00aaff, #0066cc);
            border: none;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            margin: 5px 5px 5px 0;
            transition: all 0.3s;
        }

        .btn:hover {
            background: linear-gradient(135deg, #00ccff, #0088ee);
            box-shadow: 0 0 10px rgba(0, 170, 255, 0.5);
        }

        .btn.active {
            background: linear-gradient(135deg, #00ff00, #00aa00);
        }

        .warnings-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(139, 0, 0, 0.95);
            border: 2px solid #ff4444;
            border-radius: 10px;
            padding: 15px;
            max-width: 350px;
            max-height: 400px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.3);
        }

        .warnings-panel h2 {
            color: #ff4444;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .warning-item {
            background: rgba(255, 0, 0, 0.2);
            border-left: 4px solid #ff4444;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        .warning-item .warning-type {
            font-weight: bold;
            color: #ffaa00;
            margin-bottom: 5px;
        }

        .warning-item .warning-area {
            font-size: 0.85em;
            color: #ffcccc;
        }

        .soundings-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(10, 14, 39, 0.95);
            border: 2px solid #00ff88;
            border-radius: 10px;
            padding: 15px;
            width: 400px;
            height: 350px;
            z-index: 1000;
            display: none;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .soundings-panel.active {
            display: block;
        }

        .soundings-panel h2 {
            color: #00ff88;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        #soundingChart {
            width: 100%;
            height: 280px;
        }

        .mesonet-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(10, 14, 39, 0.95);
            border: 2px solid #ffaa00;
            border-radius: 10px;
            padding: 15px;
            max-width: 300px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.3);
        }

        .mesonet-panel h2 {
            color: #ffaa00;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .mesonet-item {
            background: rgba(255, 170, 0, 0.1);
            border-left: 3px solid #ffaa00;
            padding: 8px;
            margin-bottom: 8px;
            border-radius: 3px;
            font-size: 0.85em;
        }

        .mesonet-item .station-name {
            font-weight: bold;
            color: #ffcc44;
        }

        .legend {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 14, 39, 0.9);
            border: 2px solid #00ffff;
            border-radius: 10px;
            padding: 10px 20px;
            z-index: 1000;
        }

        .legend-title {
            color: #00ffff;
            font-size: 0.9em;
            margin-bottom: 5px;
            text-align: center;
        }

        .legend-scale {
            display: flex;
            height: 20px;
            width: 300px;
            border-radius: 3px;
            overflow: hidden;
        }

        .legend-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
            font-size: 0.75em;
            color: #aaddff;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 20px 40px;
            border-radius: 10px;
            border: 2px solid #00ffff;
            z-index: 2000;
            display: none;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid rgba(0, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 4px solid #00ffff;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info-display {
            background: rgba(0, 100, 200, 0.2);
            border-radius: 5px;
            padding: 8px;
            margin-top: 10px;
            font-size: 0.85em;
        }

        .info-display .info-label {
            color: #00ccff;
            font-weight: bold;
        }

        .checkbox-group {
            margin: 10px 0;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            margin: 5px 0;
            cursor: pointer;
        }

        .checkbox-group input[type="checkbox"] {
            margin-right: 8px;
            cursor: pointer;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }

        ::-webkit-scrollbar-thumb {
            background: #00aaff;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #00ccff;
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>

    <!-- Control Panel -->
    <div class="control-panel">
        <h2>🌍 Global Weather Radar</h2>

        <div class="control-group">
            <label>View Mode:</label>
            <select id="viewMode">
                <option value="globe">3D Globe</option>
                <option value="map2d">2D Map</option>
            </select>
        </div>

        <h3>Radar Controls</h3>

        <div class="checkbox-group">
            <label>
                <input type="checkbox" id="radarReflectivity" checked>
                Radar Reflectivity
            </label>
            <label>
                <input type="checkbox" id="radarVelocity">
                Radar Velocity
            </label>
            <label>
                <input type="checkbox" id="radarComposite">
                Composite Radar
            </label>
        </div>

        <div class="control-group">
            <label>Opacity: <span id="opacityValue">0.7</span></label>
            <input type="range" id="radarOpacity" min="0" max="1" step="0.1" value="0.7">
        </div>

        <div class="control-group">
            <label>Animation Speed:</label>
            <input type="range" id="animationSpeed" min="0" max="10" step="1" value="5">
        </div>

        <div class="control-group">
            <button class="btn" id="playAnimation">▶ Play Animation</button>
            <button class="btn" id="stopAnimation">⏸ Pause</button>
        </div>

        <h3>Data Layers</h3>

        <div class="checkbox-group">
            <label>
                <input type="checkbox" id="showWarnings" checked>
                NWS Warnings
            </label>
            <label>
                <input type="checkbox" id="showMesonet" checked>
                Mesonet Stations
            </label>
            <label>
                <input type="checkbox" id="showLightning">
                Lightning Strikes
            </label>
            <label>
                <input type="checkbox" id="showSatellite">
                Satellite Imagery
            </label>
        </div>

        <h3>Soundings</h3>

        <div class="control-group">
            <label>Select Station:</label>
            <select id="soundingStation">
                <option value="">Click map to select...</option>
                <option value="KOKC">Oklahoma City (KOKC)</option>
                <option value="KDDC">Dodge City (KDDC)</option>
                <option value="KOUN">Norman (KOUN)</option>
                <option value="KSGF">Springfield (KSGF)</option>
                <option value="KTOP">Topeka (KTOP)</option>
            </select>
        </div>

        <button class="btn" id="loadSounding">Load Sounding</button>

        <h3>Search Location</h3>

        <div class="control-group">
            <input type="text" id="searchLocation" placeholder="Enter city or coordinates...">
            <button class="btn" id="searchBtn" style="width: 100%; margin-top: 5px;">Search</button>
        </div>

        <div class="info-display">
            <div class="info-label">Current View:</div>
            <div id="currentLocation">Global View</div>
            <div class="info-label" style="margin-top: 5px;">Data Updated:</div>
            <div id="lastUpdate">--:--</div>
        </div>
    </div>

    <!-- Warnings Panel -->
    <div class="warnings-panel">
        <h2>⚠️ Active NWS Warnings</h2>
        <div id="warningsList">
            <div style="text-align: center; color: #ffcccc; padding: 20px;">
                Loading warnings...
            </div>
        </div>
    </div>

    <!-- Soundings Panel -->
    <div class="soundings-panel" id="soundingsPanel">
        <h2>📊 Atmospheric Sounding</h2>
        <canvas id="soundingChart"></canvas>
        <button class="btn" id="closeSounding" style="margin-top: 10px;">Close</button>
    </div>

    <!-- Mesonet Panel -->
    <div class="mesonet-panel">
        <h2>🌡️ Mesonet Data</h2>
        <div id="mesonetList">
            <div style="text-align: center; color: #ffddaa; padding: 20px;">
                Loading mesonet data...
            </div>
        </div>
    </div>

    <!-- Legend -->
    <div class="legend">
        <div class="legend-title">Radar Reflectivity (dBZ)</div>
        <div class="legend-scale" id="legendScale"></div>
        <div class="legend-labels">
            <span>-30</span>
            <span>0</span>
            <span>20</span>
            <span>40</span>
            <span>60</span>
            <span>75</span>
        </div>
    </div>

    <!-- Loading Indicator -->
    <div class="loading" id="loadingIndicator">
        <div class="spinner"></div>
        <div style="text-align: center; color: #00ffff;">Loading data...</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
